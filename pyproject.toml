[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdst"
version = "0.2.0"
description = "CoDing Sequence Typer (CDST): a decentralized, hash-based bacterial genome typing and clustering pipeline"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0" }
authors = [{ name = "CDST authors" }]

# These are the versions we have tested. Other versions may work but are not systematically tested.
dependencies = [
  "biopython==1.85",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "scikit-learn==1.5.1",
  "networkx==3.3",
  "matplotlib>=3.9",
  "joblib==1.4.*"
]

# Expose the CLI used by Bioconda's test: `cdst --help`
[project.scripts]
cdst = "cdst:main"

[tool.setuptools]
# We install `cdst.py` as a pure Python module so the entry point above can import it.
# If you later want to ship additional top-level .py utilities as importable modules,
# list them here (without the .py extension).
py-modules = ["cdst"]
